<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMP Map Rendering MVP</title>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div id="status">Loading map…</div>

  <div id="app">
    <div id="map"></div>

    <aside id="side-panel" aria-label="DA details">
      <header class="panel-header">
        <h2 id="panel-title">DA details</h2>
      </header>
      <div id="panel-body">
        <p class="panel-empty">Click a dissemination area on the map to view its census data.</p>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
  <script src="js/districts.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/labels.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
